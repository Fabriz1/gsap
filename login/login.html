<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Maturità Facile</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- CSS Personalizzato -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">
        <div class="row g-0 h-100">

            <!-- Colonna Sinistra (Carosello) -->
            <div class="col-lg-5 d-none d-lg-flex flex-column justify-content-between p-5 left-panel">
                
                <div class="left-panel-content">
                    <!-- Puoi cambiare "Maturità Facile" con il tuo logo -->
                    <h2 class="logo">Maturità Facile</h2>
                    <div class="tagline">
                        <h1>Riassumi,<br>Ripassa</h1>
                    </div>
                </div>

                <!-- Carosello che funge da sfondo -->
                <div id="imageCarousel" class="carousel slide carousel-fade h-100" data-bs-ride="carousel">
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#imageCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                        <button type="button" data-bs-target="#imageCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                        <button type="button" data-bs-target="#imageCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
                    </div>
                    <div class="carousel-inner h-100">
                        <div class="carousel-item active h-100">
                            <!-- Assicurati che il percorso dell'immagine sia corretto! -->
                            <img src="../media/carosello1.jpg" class="d-block w-100 h-100" alt="Paesaggio 1">
                        </div>
                        <div class="carousel-item h-100">
                            <img src="../media/carosello2.jpg" class="d-block w-100 h-100" alt="Paesaggio 2">
                        </div>
                        <div class="carousel-item h-100">
                            <img src="../media/carosello3.jpg" class="d-block w-100 h-100" alt="Paesaggio 3">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Colonna Destra (Login) -->
            <div class="col-12 col-lg-7 d-flex flex-column justify-content-center text-center p-4 p-md-5 form-section">
                
                <h1 class="form-title">Accedi a Maturità Facile</h1>
                <p class="form-subtitle">Crea e salva tutti i riassunti che desideri, arriverai alla maturità piu preparato che mai</p>

                <div class="login-actions">
                    <!-- Bottone per il login con Google -->
                    <button id="google-login-btn" class="btn btn-google-login w-100">
                        <!-- Icona Google (SVG) -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.35 11.1h-9.3v2.8h5.3c-.5 2.2-2.5 3.7-4.9 3.7-2.9 0-5.3-2.4-5.3-5.3s2.4-5.3 5.3-5.3c1.3 0 2.4.5 3.3 1.4l2.1-2.1C16.9 3.5 14.6 2.5 12 2.5c-5.2 0-9.5 4.3-9.5 9.5s4.3 9.5 9.5 9.5c5.2 0 9.2-4.3 9.2-9.2 0-.6 0-1.1-.1-1.6z"/></svg>
                        Accedi con Google
                    </button>

                    <!-- Messaggio di errore per Firebase -->
                    <p id="error-message" class="error-text mt-3"></p>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <!-- I tuoi script per Firebase -->
    <script type="module" src="../firebase-init.js"></script>
    <script type="module" src="login.js"></script>
</body>

</html>
