<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Accedi - Maturità Facile</title>
    <!-- Crea un file login.css per abbellire la pagina come preferisci -->
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <h1>Maturità Facile</h1>
        <p>Accedi con il tuo account Google per continuare</p>

        <!-- L'unico bottone che ci serve! -->
        <button id="google-login-btn">
            <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google Logo" width="20"/>
            Accedi con Google
        </button>

        <p id="error-message" class="error"></p>
    </div>

    <!-- Script di Firebase e della pagina -->
    <!-- Il percorso qui assume che la cartella 'login' sia allo stesso livello di 'firebase-init.js' -->
    <script type="module" src="../firebase-init.js"></script>
    <script type="module" src="login.js"></script>
</body>
</html>
