<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maturità Facile - Mobile</title>
    <link href="style-mobile.css" rel="stylesheet" type="text/css">
</head>
<body>
    <div class="mobile-container">
        <!-- L'header ora contiene solo l'icona utente, il titolo è separato per l'animazione -->
        <header class="mobile-header">
            
        </header>

        <div class="title-animation-wrapper"> <!-- Wrapper per il titolo animato -->
            <h1 class="animated-title">Maturità Facile</h1>
        </div>

        <main class="mobile-main-content">
            <!-- Il pannello azioni ora è qui e apparirà dopo l'animazione del titolo -->
            <nav class="mobile-actions-panel">
                <div class="mobile-action-card nuovo-mobile-btn">
                    <h2>Nuovo Riassunto</h2>
                    <svg class="mobile-icon" width="44" height="44" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 12H18M12 6V18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </div>
                <div class="mobile-action-card continua-mobile-btn">
                    <h2>Miei Riassunti</h2>
                     <svg class="mobile-icon" width="44" height="44" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff">
                        <path d="M3 10C3 6.22876 3 4.34315 4.17157 3.17157C5.34315 2 7.22876 2 11 2H13C16.7712 2 18.6569 2 19.8284 3.17157C21 4.34315 21 6.22876 21 10V14C21 17.7712 21 19.6569 19.8284 20.8284C18.6569 22 16.7712 22 13 22H11C7.22876 22 5.34315 22 4.17157 20.8284C3 19.6569 3 17.7712 3 14V10Z" stroke-width="1.5"></path>
                        <path d="M9 2V22" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                        <path d="M8 7H16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                        <path d="M8 12H16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                        <path d="M8 17H12" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                     </svg>
                </div>
            </nav>
            <p class="mobile-description">
                Carica il PDF di un programma scolastico per creare un riassunto completo.
            </p>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <!-- Observer non è più necessario per questa logica specifica -->
    <script src="script-mobile.js"></script>
</body>
</html>
