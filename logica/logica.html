<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elaborazione Riassunto - Maturità Facile</title>
    <link rel="stylesheet" href="logica.css">
    
</head>
<body>
    <div class="container">
        <header>
            <h1>Maturità Facile - Il Tuo Riassunto</h1>
        </header>

        <div id="controls">
            <label for="apiKeyInput">Inserisci la tua API Key di Google Gemini:</label>
            <input type="password" id="apiKeyInput" placeholder="GEMINI_API_KEY">
            <button id="startButton">Avvia Elaborazione</button>
        </div>

        <div id="statusMessage">Pronto per iniziare. Inserisci la tua API Key e clicca "Avvia".</div>

        <div id="resultsContainer">
            
        </div>

        <button id="downloadPdfButton" style="display:none;">Salva/Stampa Riassunti (PDF)</button>

    </div>

    <script type="module" src="logica.js"></script>
</body>
</html>
